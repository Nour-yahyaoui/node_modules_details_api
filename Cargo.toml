[package]
name = "node-modules-details-api"
version = "2.0.0"
edition = "2021"
description = "REST API + browsable documentation hub for 779 Node.js libraries — descriptions, usage examples, tags, and categories."
license = "MIT"
authors = ["Nour Yahyaoui"]
readme = "README.md"
repository = "https://github.com/Nour-yahyaoui/node_modules_details_api"

[dependencies]
actix-web = { version = "4", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
strip = true
lto = true
